apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mdarifahammedreza/simpleChatui.git
    targetRevision: prod
    path: k8s/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: chat-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
