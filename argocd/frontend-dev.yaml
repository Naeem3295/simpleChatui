apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mdarifahammedreza/simpleChatui.git
    targetRevision: dev
    path: k8s/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: chat-dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    # No 'automated' block: dev/stage require a human to click Sync in Argo CD.
