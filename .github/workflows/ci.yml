name: CI - Build & Validate

on:
  push:
    branches: [dev, stage, prod]
  pull_request:
    branches: [dev, stage, prod]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Type-check & build
        run: yarn build

      - name: Docker build (validation only, no push)
        run: |
          docker build -f Dockerfile.dev -t frontend:dev-validate .
          docker build -f Dockerfile.prod -t frontend:prod-validate .
